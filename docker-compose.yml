services:
  web:
    build:
      context: .
      dockerfile: compose/Dockerfile
      target: production
    ports:
      - '127.0.0.1:8000:80'
  dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: compose/Dockerfile
      target: development
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./app:/app
      - dependencies:/app/node_modules
volumes:
  dependencies:
